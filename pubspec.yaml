name: globly
description: "Globly - geospatial social media."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Networking & state
  dio: ^5.8.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.4

  # Map & location
  mapbox_maps_flutter: 3.34.2
  latlong2: ^0.9.1
  geolocator: ^14.0.0

  # Media
  image_picker: ^1.1.2
  cross_file: ^0.3.4
  video_player: ^2.9.5
  audioplayers: ^6.4.0
  cached_network_image: ^3.4.1
  cloudflare_turnstile: ^3.8.1
  shared_preferences: ^2.5.6
  flutter_localizations:
    sdk: flutter
  intl: any
  record: ^7.1.2
  path_provider: ^2.1.6
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations*.dart from the .arb files (see l10n.yaml).
  generate: true

# cloudflare_turnstile -> flutter_inappwebview. The stable 6.1.x Android implementation uses
# getDefaultProguardFile('proguard-android.txt'), which the current Android Gradle Plugin rejects.
# The 6.2.0 beta family fixes it; all flutter_inappwebview* packages must be on the same release.
# Remove these overrides once 6.2.0 is published as stable.
dependency_overrides:
  flutter_inappwebview: 6.2.0-beta.3
